server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ingestion endpoint (rwatch) and read API (frontend), forwarded to NestJS.
    # No URI after the upstream: the full path, /api/... included, is passed on.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Angular router: paths that are not files fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}